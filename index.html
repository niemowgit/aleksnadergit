<style>
:root{color-scheme:dark;--bg:#031a2b;--fg:#e6faff;--ac:#38e8ff;--ac2:#ffe94d;--pn:rgba(3,26,43,.82)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;pointer-events:none;padding:10px;padding-top:calc(52px + env(safe-area-inset-top,0px))}
#lb{right:0;top:0;background:var(--pn);border-radius:0 0 0 12px;font-size:13px;min-width:150px}#lb b{color:var(--ac2)}#sc{left:0;top:0;font-size:15px;text-shadow:0 0 6px #000}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(3,26,43,.8);text-align:center;padding:60px 16px 16px;overflow:auto}
.lg{width:min(72vw,360px);height:auto}
input,button{font:inherit;padding:11px 18px;border-radius:10px;border:2px solid var(--ac);background:#06324d;color:var(--fg)}
#go{background:var(--ac);color:#02202f;font-weight:700;cursor:pointer;font-size:20px;padding:12px 40px}
#desc{margin:0;max-width:440px;opacity:.9;line-height:1.4;font-size:14px}#best{color:var(--ac2);font-size:14px}
#skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px}
#skins button{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid transparent}
#skins button.on{border-color:#fff;box-shadow:0 0 12px var(--ac2)}
small{opacity:.7}
#boost{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:rgba(255,233,77,.25);border:3px solid var(--ac2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ac2);user-select:none}
#tabs{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;gap:6px;z-index:5;overflow-x:auto;padding:0 6px;justify-content:safe center}
#tabs button{font-size:13px;padding:7px 12px;white-space:nowrap;border:2px solid #1a6a8c;border-radius:20px}
#tabs button.on{background:var(--ac);color:#02202f;border-color:var(--ac)}
#splash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(#0a4a73,#021525);z-index:20}
#splash.on{display:flex}#splash img{width:min(88vw,640px);animation:pop 1.5s ease-out both}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}40%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 40px #ffe94d)}}
#tabs img{height:24px;width:auto;vertical-align:middle;margin-right:6px}
#tabs button{display:flex;align-items:center}
#acct{font-size:13px;opacity:.9}#glb{font-size:13px;background:var(--pn);border-radius:10px;padding:8px 14px;min-width:210px;text-align:left}#glb:empty{display:none}#glb b{color:var(--ac2)}
#quest{position:fixed;right:10px;top:calc(205px + env(safe-area-inset-top,0px));background:var(--pn);border:2px solid var(--ac2);border-radius:12px;padding:8px 12px;font-size:12px;max-width:215px;display:none;pointer-events:none;line-height:1.4}
#toast{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pn);border:2px solid var(--ac2);padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;font-size:14px;text-align:center}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="sc"></div><div class="hud" id="lb"></div>
<div id="tabs"></div>
<div id="toast"></div>
<div id="quest"></div>
<div id="boost">ZAP</div>
<div id="menu"><img class="lg" alt="Electro Statistic">
<div id="acct">👤 Łączenie z kontem…</div><p id="desc"></p><div id="best"></div><div id="glb"></div>
<input id="nm" maxlength="12" placeholder="Twoje imię">
<small>Wybierz skina:</small><div id="skins"></div>
<button id="go">GRAJ</button></div>
<div id="splash"><img class="lg" alt="Electro Statistic"></div>

   for(const e of this.E){if(!e.alive||dist(e.x,e.y,s.x,s.y)>s.r+e.r)continue;burst(e.x,e.y,[255,240,120],12);if(mode==='cell')e.r=Math.max(14,e.r*.8);else{e.hp-=35;if(e.hp<=0)this.die(e)}}}},
 crys(){return{x:rnd(80,WW-80),y:rnd(80,WW-80),r:rnd(12,26),hp:30,col:rskin().a}},
 mk(bot,name,sk,skn){const e={x:rnd(200,WW-200),y:rnd(200,WW-200),r:(mode==='cell'?20:18)+(bot?rnd(0,5):0),skn,col:skn.a,col2:skn.b,name,bot,sk,score:0,tt:0,cd:0,alive:true,rs:0,oc:0,evo:0,rev:0,hid:false,th:'',tx:(WW/2),ty:(WW/2),sa:0,shoot:false,tg:null};e.hp=e.mh=40+e.r*3;return e},
 start(demo){WW=mode==='tank'?4600:3000;this.E=[];this.O=[];this.Bo=[];this.dec=[];this.me=null;this.st=[];this.fl=[];this.bat=[];for(let i=0;i<8;i++)this.bat.push(this.btr());this.mp=[];hasMap=false;for(let i=0;i<2;i++)this.mp.push({x:rnd(300,WW-300),y:rnd(300,WW-300)});this.bush=[];this.q=null;if(mode==='tank'){for(let i=0;i<34;i++)this.bush.push({x:rnd(150,WW-150),y:rnd(150,WW-150),r:rnd(70,125)});this.q={st:0,cx:280,cy:280,dx:WW-280,dy:WW-280}}
  for(let i=0;i<12;i++)this.E.push(this.mk(true,NAMES[i],i%3,SKINS[(i+3)%8]));
  if(!demo){const m=this.me=this.mk(false,$('nm').value.trim()||'Ty',0,SKINS[skin]);m.x=m.y=(WW/2);this.E.push(m)}
  if(mode==='cell')for(let i=0;i<450;i++)this.O.push(this.pel());else for(let i=0;i<70;i++)this.O.push(this.crys());
  for(let i=0;i<140;i++)this.dec.push({x:rnd(0,WW),y:rnd(0,WW),r:rnd(20,110),k:Math.random()});
  this.cam.x=this.cam.y=(WW/2);this.z=1;running=!demo;if(!demo){$('menu').style.display='none';toast('🗺️ Znajdź mapę (ikona radaru), by odblokować minimapę')}},
 die(o){o.alive=false;o.rs=150;burst(o.x,o.y,o.col,22);if(o===this.me){saveBest(o.score);over('Koniec! Twój wynik: '+o.score+'. Spróbuj jeszcze raz.')}},
 think(e){const K=SK[e.sk],L=this.E.filter(o=>o!==e&&o.alive);let best=null,bd=1e9,thr=null,td=1e9;
  if(mode==='cell'){const need=1.12+(2-e.sk)*.1;
   for(const o of L){const d=dist(e.x,e.y,o.x,o.y);if(o.r>e.r*1.12&&d<o.r+260*K.aw&&d<td){td=d;thr=o}else if(e.r>o.r*need&&d<450*K.aw&&d<bd){bd=d;best=o}}
   if(thr){e.tx=e.x*2-thr.x;e.ty=e.y*2-thr.y;e.th='uciekam przed '+thr.name+'!'}
   else if(best){e.tx=best.x;e.ty=best.y;e.th='gonię '+best.name}
   else{let b2=1e9,ob=null;for(const o of this.O){const d=dist(e.x,e.y,o.x,o.y);if(d<b2){b2=d;ob=o}}
    if(ob){e.tx=ob.x;e.ty=ob.y;e.th='szukam planktonu'}else{e.tx=e.ty=(WW/2);e.th='idę na środek'}}
   e.tx+=rnd(-1,1)*K.nz*220;e.ty+=rnd(-1,1)*K.nz*220}
  else{
   for(const o of L){const d=dist(e.x,e.y,o.x,o.y);if(d<bd&&(!o.hid||d<170)){bd=d;best=o}}
   if(e.sk>0&&best&&e.hp<e.mh*.35&&bd<450){e.tx=e.x*2-best.x;e.ty=e.y*2-best.y;e.th='ranny, uciekam!';e.shoot=false;e.tg=best}
   else if(best&&bd<600*K.aw){e.tg=best;e.shoot=true;const k=bd>260?1:-.3;e.tx=e.x+(best.x-e.x)*k;e.ty=e.y+(best.y-e.y)*k;e.th='celuję w '+best.name}
   else{let b2=1e9,ob=null;for(const o of this.O){const d=dist(e.x,e.y,o.x,o.y);if(d<b2){b2=d;ob=o}}
    e.tg=ob;e.shoot=!!ob&&b2<400;if(ob){e.tx=ob.x;e.ty=ob.y}e.th='rozbijam kryształy'}}
  if(e.sk>0){let bb=null,bd2=600*K.aw;for(const b of this.bat){const d=dist(e.x,e.y,b.x,b.y);if(d<bd2){bd2=d;bb=b}}if(bb&&!/^(uciekam|ranny)/.test(e.th)){e.tx=bb.x;e.ty=bb.y;e.th='biorę baterię 🔋'}}},
 step(e){
  if(!e.alive){if(e.bot&&--e.rs<=0)Object.assign(e,this.mk(true,e.name,e.sk,rskin()),{score:e.score});return}
  const K=SK[e.sk];let tx,ty;
  if(e.bot){if(--e.tt<=0){this.think(e);e.tt=K.tt}tx=e.tx;ty=e.ty}else{tx=this.cam.x+(mouse.x-VW/2)/this.z;ty=this.cam.y+(mouse.y-VH/2)/this.z}
  const d=dist(e.x,e.y,tx,ty),a=Math.atan2(ty-e.y,tx-e.x);
  const sp=(mode==='cell'?2.5*Math.pow(e.r/20,-.3):2.9)*(e.bot?K.spd*(mode==='tank'?.88:1):1)*(e.oc>0?1.4:1)*(e===this.me&&this.q&&this.q.st==1?.85:1)*Math.min(1,d/60);
  e.x=cl(e.x+Math.cos(a)*sp,e.r,WW-e.r);e.y=cl(e.y+Math.sin(a)*sp,e.r,WW-e.r);
  if(e.oc>0){e.oc--;if(T%10==0)for(const o of this.E){if(o!==e&&o.alive&&dist(o.x,o.y,e.x,e.y)<e.r+o.r+60){if(mode==='cell'){if(o.r>12)o.r-=.3}else{o.hp-=2;if(o.hp<=0){e.score+=10;this.die(o)}}}}}
  for(let i=0;i<this.bat.length;i++){const b=this.bat[i];if(dist(b.x,b.y,e.x,e.y)<e.r+24){e.oc=480;this.bat[i]=this.btr();if(e===this.me)toast('🔋 Przeładowanie! Szybciej + prąd rani wrogów wokół')}}
  if(e===this.me)for(let i=this.mp.length-1;i>=0;i--){const q=this.mp[i];if(dist(q.x,q.y,e.x,e.y)<e.r+32){this.mp.splice(i,1);hasMap=true;toast('🗺️ Mapa znaleziona! Minimapa odblokowana')}}
  if(mode==='cell'){
   for(let i=this.O.length-1;i>=0;i--){const o=this.O[i];if(Math.abs(o.x-e.x)<e.r&&Math.abs(o.y-e.y)<e.r&&dist(o.x,o.y,e.x,e.y)<e.r){e.r=Math.sqrt(e.r*e.r+o.r*o.r);e.score+=Math.round(o.r);this.O.splice(i,1);this.O.push(this.pel())}}
   for(const o of this.E){if(o===e||!o.alive)continue;if(e.r>o.r*1.12&&dist(o.x,o.y,e.x,e.y)<e.r-o.r*.3){e.r=Math.sqrt(e.r*e.r+o.r*o.r*.8);e.score+=Math.round(o.r*2);this.die(o)}}}
  else{e.cd--;e.hp=Math.min(e.mh,e.hp+.03);e.hid=false;for(const b of this.bush)if(dist(b.x,b.y,e.x,e.y)<b.r-e.r*.3){e.hid=true;break}if(e.rev>0){e.rev--;e.hid=false}if(e.bot&&T%1800==900&&e.evo<2+e.sk*2)e.evo++;
   if(e.bot){if(e.tg)e.sa=Math.atan2(e.tg.y-e.y,e.tg.x-e.x)+rnd(-1,1)*K.nz*.75}else e.sa=a;
   if((e.bot?e.shoot:boostIn)&&e.cd<=0){{const nb=EVNB[e.evo];e.cd=(EVCD[e.evo]+(e.bot?(2-e.sk)*8:0))*(e.bot?1.25:1)/(e.oc>0?2:1);const px=Math.cos(e.sa+1.5708),py=Math.sin(e.sa+1.5708),sv=9+e.evo*.3;
   for(let k=0;k<nb;k++){const o=(k-(nb-1)/2)*e.r*.42,sa=e.sa+(nb>2?(k-(nb-1)/2)*.07:0);this.Bo.push({x:e.x+px*o+Math.cos(e.sa)*e.r*1.4,y:e.y+py*o+Math.sin(e.sa)*e.r*1.4,vx:Math.cos(sa)*sv,vy:Math.sin(sa)*sv,l:60,o:e,rad:e.evo*1.5,d:(10+e.r*.2)*(e.bot?.65:1)*(1+e.evo*.15),ev:e.evo})}e.rev=70}}}},
 bolts(){for(let i=this.Bo.length-1;i>=0;i--){const b=this.Bo[i];b.x+=b.vx;b.y+=b.vy;let rm=--b.l<=0;
  if(!rm)for(const o of this.E){if(o===b.o||!o.alive)continue;if(dist(b.x,b.y,o.x,o.y)<o.r+b.rad){o.hp-=b.d;rm=true;if(o.hp<=0){b.o.score+=10;b.o.r=Math.min(34,b.o.r+1.5);b.o.hp=b.o.mh=40+b.o.r*3;this.die(o)}break}}
  if(!rm)for(let j=this.O.length-1;j>=0;j--){const o=this.O[j];if(dist(b.x,b.y,o.x,o.y)<o.r+b.rad){o.hp-=b.d;rm=true;if(o.hp<=0){this.O.splice(j,1);b.o.score+=3;b.o.r=Math.min(34,b.o.r+.3);b.o.mh=40+b.o.r*3;this.O.push(this.crys())}break}}
  if(rm)this.Bo.splice(i,1)}},
 frame(){const m=this.me,c0=this.cam;for(const e of this.E)this.step(e);this.bolts();this.storm();this.quest();
  if(m&&m.alive&&running){c0.x+=(m.x-c0.x)*.12;c0.y+=(m.y-c0.y)*.12;const zt=mode==='cell'?Math.max(.72,Math.min(1,34/m.r)):.9;this.z+=(zt-this.z)*.05}
  else{c0.x=(WW/2)+Math.cos(T*.004)*300;c0.y=(WW/2)+Math.sin(T*.003)*300;this.z+=(.8-this.z)*.05}
  const z=this.z;water(c0.x,c0.y,z);ctx.save();ctx.translate(VW/2,VH/2);ctx.scale(z,z);ctx.translate(-c0.x,-c0.y);
  const cell=mode==='cell';
  ctx.fillStyle=cell?'#2f8a3e':'#85744a';ctx.fillRect(0,0,WW,WW);
  for(const d of this.dec){if(Math.abs(d.x-c0.x)>VW/2/z+120||Math.abs(d.y-c0.y)>VH/2/z+120)continue;
   ctx.fillStyle=cell?(d.k<.5?'rgba(120,210,90,.25)':'rgba(20,90,40,.25)'):(d.k<.5?'rgba(150,150,150,.4)':'rgba(70,120,50,.35)');ctx.beginPath();ctx.arc(d.x,d.y,d.r*(cell?1:.6),0,6.3);ctx.fill()}
  ctx.strokeStyle='#ecd9a0';ctx.lineWidth=30;ctx.strokeRect(-12,-12,WW+24,WW+24);
  for(const o of this.O){if(Math.abs(o.x-c0.x)>VW/2/z+50||Math.abs(o.y-c0.y)>VH/2/z+50)continue;
   ctx.fillStyle=`rgb(${o.col})`;ctx.beginPath();
   if(cell){ctx.arc(o.x,o.y,o.r,0,6.3);ctx.fill()}else{ctx.moveTo(o.x,o.y-o.r);ctx.lineTo(o.x+o.r,o.y);ctx.lineTo(o.x,o.y+o.r);ctx.lineTo(o.x-o.r,o.y);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
  for(const q of this.mp){if(Math.abs(q.x-c0.x)>VW/2/z+60||Math.abs(q.y-c0.y)>VH/2/z+60)continue;ctx.fillStyle=`rgba(80,200,255,${.2+Math.sin(T*.1)*.08})`;ctx.beginPath();ctx.arc(q.x,q.y,38,0,6.3);ctx.fill();ctx.drawImage(radarImg,q.x-28,q.y-28,56,56)}
  for(const b of this.bat){if(Math.abs(b.x-c0.x)>VW/2/z+50||Math.abs(b.y-c0.y)>VH/2/z+50)continue;ctx.fillStyle=`rgba(80,200,255,${.2+Math.sin(T*.12)*.08})`;ctx.beginPath();ctx.arc(b.x,b.y,30,0,6.3);ctx.fill();ctx.drawImage(batImg,b.x-17,b.y-19+Math.sin(T*.08+b.x)*3,34,38)}
  for(const s of this.st){const k=1-s.t/150;ctx.strokeStyle='rgba(255,70,70,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.stroke();ctx.fillStyle=`rgba(255,70,70,${.1+k*.3})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r*k,0,6.3);ctx.fill()}
  for(let i=this.fl.length-1;i>=0;i--){const s=this.fl[i];ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(s.x+60,s.y-900);ctx.lineTo(s.x-30,s.y-400);ctx.lineTo(s.x+30,s.y-300);ctx.lineTo(s.x,s.y);ctx.stroke();ctx.fillStyle=`rgba(255,255,200,${s.f/20})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill();if(--s.f<=0)this.fl.splice(i,1)}
  for(const e of this.E){if(!e.alive)continue;if(e.hid&&e!==m&&dist(e.x,e.y,m?m.x:0,m?m.y:0)>200)continue;const c=e.col.join(','),c2=e.col2.join(',');
   ctx.fillStyle=`rgba(${c},.22)`;ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.5,0,6.3);ctx.fill();
   if(!cell){const nb=EVNB[e.evo],px=Math.cos(e.sa+1.5708),py=Math.sin(e.sa+1.5708);ctx.strokeStyle=`rgb(${c2})`;ctx.lineCap='butt';ctx.lineWidth=e.r*.5/Math.pow(nb,.55);for(let k=0;k<nb;k++){const o=(k-(nb-1)/2)*e.r*.42,L=e.r*(1.6+(nb>2&&k>0&&k<nb-1?.25:0));ctx.beginPath();ctx.moveTo(e.x+px*o,e.y+py*o);ctx.lineTo(e.x+px*o+Math.cos(e.sa)*L,e.y+py*o+Math.sin(e.sa)*L);ctx.stroke()}}
   ctx.fillStyle=`rgb(${c})`;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.3);ctx.fill();
   ctx.strokeStyle=`rgb(${c2})`;ctx.lineWidth=Math.max(3,e.r*.2);ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(e.x-e.r*.3,e.y-e.r*.3,e.r*.3,0,6.3);ctx.fill();
   ctx.strokeStyle='#eaffff';ctx.lineWidth=1.5;ctx.beginPath();for(let k=0;k<=18;k++){const a=k/18*6.283,rr=e.r*((e.oc>0?1.4:1.08)+rnd(-.05,.2));ctx.lineTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr)}ctx.stroke();
   if(!cell){ctx.fillStyle='#300';ctx.fillRect(e.x-e.r,e.y+e.r+6,e.r*2,4);ctx.fillStyle='#4f4';ctx.fillRect(e.x-e.r,e.y+e.r+6,e.r*2*Math.max(0,e.hp/e.mh),4)}
   ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText(e.name+(e.bot?' '+SK[e.sk].ic:'')+(mode==='tank'&&e.evo?' ★'+e.evo:''),e.x,e.y-e.r-18);
   if(e.bot&&e.th){ctx.font='11px system-ui';ctx.fillStyle='rgba(255,255,160,.98)';ctx.fillText('💭 '+e.th,e.x,e.y-e.r-5)}}
  for(const b of this.bush){if(Math.abs(b.x-c0.x)>VW/2/z+130||Math.abs(b.y-c0.y)>VH/2/z+130)continue;const al=(m&&m.alive&&dist(b.x,b.y,m.x,m.y)<b.r)?.5:.93;ctx.fillStyle=`rgba(34,110,48,${al})`;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.3);ctx.fill();ctx.fillStyle=`rgba(70,160,70,${al})`;ctx.beginPath();ctx.arc(b.x-b.r*.25,b.y-b.r*.25,b.r*.6,0,6.3);ctx.fill()}
  if(this.q&&m&&m.alive){const q=this.q,tx=q.st?q.dx:q.cx,ty=q.st?q.dy:q.cy;ctx.textAlign='center';ctx.font='46px system-ui';ctx.fillText('🕳️',q.dx,q.dy+14);ctx.font='13px system-ui';ctx.fillStyle='#fff';ctx.fillText('DZIUPLA',q.dx,q.dy-34);
   if(!q.st&&m.evo<8){ctx.font='40px system-ui';ctx.fillText('📦',q.cx,q.cy+14)}
   if(q.st){ctx.font='26px system-ui';ctx.fillText('📦',m.x,m.y-m.r-30)}
   if(m.evo<8&&running){const a=Math.atan2(ty-m.y,tx-m.x),px=m.x+Math.cos(a)*(m.r+70),py=m.y+Math.sin(a)*(m.r+70);ctx.fillStyle='#ffe94d';ctx.beginPath();ctx.moveTo(px+Math.cos(a)*14,py+Math.sin(a)*14);ctx.lineTo(px+Math.cos(a+2.5)*10,py+Math.sin(a+2.5)*10);ctx.lineTo(px+Math.cos(a-2.5)*10,py+Math.sin(a-2.5)*10);ctx.fill()}}
  ctx.lineCap='round';for(const b of this.Bo){ctx.strokeStyle=b.ev>=6?'#ff7bff':b.ev>=3?'#7bf0ff':'#fffbd0';ctx.lineWidth=3+b.ev*1.1;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*1.5+rnd(-3,3),b.y-b.vy*1.5+rnd(-3,3));ctx.stroke()}
  drawP();ctx.restore();if(running&&hasMap)mini(this.E,WW,m);
  if(T%15==0)hud(this.E,m,e=>cell?Math.floor(e.r):e.score,(cell?'Rozmiar '+(m?Math.floor(m.r):0)+' · ':'')+'Wynik '+(m?m.score:0))}};
/* ================= UI ================= */
const MODES={snake:['🐍 Eels','Steruj myszką/palcem. Przytrzymaj klik, SPACJĘ lub ZAP: przyspieszasz i porażasz pobliskich wrogów. Nie wpadaj w cudze ciało! Znajdź 🗺️ mapę (ikona radaru) na planszy: dopiero wtedy odblokujesz minimapę. Boty: 🟢 słaby, 🟡 średni, 🔴 mocny.'],
cell:['🫧 Cells','Mapa naziemna otoczona wodą. Zjadaj plankton i mniejsze komórki, uciekaj przed większymi. Zbieraj 🔋 baterie (szybkość + prąd rani wrogów wokół) i uciekaj z czerwonych kół ⚡ burzy!'],
tank:['🔫 Tanks','Mapa naziemna otoczona wodą. Steruj myszką, przytrzymaj klik / SPACJĘ / ZAP, by strzelać piorunami w boty i kryształy. Zbieraj 🔋 baterie (szybszy ogień) i uciekaj z kół ⚡ burzy! Chowaj się w krzakach 🌿 (wrogowie Cię nie widzą, dopóki nie strzelisz). Na starcie masz 1 wolną lufę. Ewolucje ★1-8 (więcej luf, większe i szybsze pociski) zdobywasz TYLKO za zadanie ze skrzynką!']};
function setMode(k){mode=k;running=false;$('desc').textContent=MODES[k][1];$('best').textContent='Rekord: '+BEST[k];$('menu').style.display='flex';
 $('boost').style.display=k==='cell'?'none':'flex';for(const b of $('tabs').children)b.classList.toggle('on',b.dataset.k===k);
 if(k==='snake')sInit();else M.start(true);loadLB()}
for(const k in MODES){const b=document.createElement('button');b.innerHTML='<img src="'+IM[k]+'" alt="">'+MODES[k][0].replace(/^\S+\s/,'');b.dataset.k=k;b.onclick=()=>setMode(k);$('tabs').appendChild(b)}
SKINS.forEach((s,i)=>{const b=document.createElement('button');b.title=s.n;b.style.background=`linear-gradient(135deg,rgb(${s.a}),rgb(${s.b}))`;b.onclick=()=>{skin=i;for(const x of $('skins').children)x.classList.toggle('on',x===b)};if(!i)b.classList.add('on');$('skins').appendChild(b)});
$('go').onclick=()=>{$('splash').classList.add('on');setTimeout(()=>{$('splash').classList.remove('on');mode==='snake'?sStart():M.start(false)},1500)};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cv.addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(e.pointerType==='mouse')boostIn=true});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')boostIn=false});
const bb=$('boost');bb.addEventListener('pointerdown',e=>{e.stopPropagation();boostIn=true});bb.addEventListener('pointerup',()=>boostIn=false);bb.addEventListener('pointercancel',()=>boostIn=false);
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){boostIn=true;e.preventDefault()}});addEventListener('keyup',e=>{if(e.code==='Space')boostIn=false});
function loop(){T++;mode==='snake'?sFrame():M.frame();requestAnimationFrame(loop)}
setMode('snake');loop();cloudInit();
</script></body></html>
